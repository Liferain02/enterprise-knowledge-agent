# 企业知识库智能助手 - 微服务化部署
#
# 服务说明：
#   agent-service : 主 Agent 服务（FastAPI + LangGraph）
#   redis         : 评估缓存（_grade_cache 持久化）+ 会话缓存
#   chroma        : 向量数据库（可选，分离部署）
#   otel-collector: OpenTelemetry 收集器（全链路追踪）
#
# 使用方式：
#   cp .env.example .env  # 编辑环境变量
#   docker-compose up -d
#   docker-compose logs -f agent-service

version: "3.9"

x-common-env: &common_env
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"
  ENVIRONMENT: ${ENVIRONMENT:-production}

services:

  # ============================================================
  # 主 Agent 服务
  # ============================================================
  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-service
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    environment:
      <<: *common_env
      # API
      API_HOST: "0.0.0.0"
      API_PORT: "${API_PORT:-8080}"
      # 数据库
      DB_PATH: "/app/data"
      # 向量数据库
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
      # Redis（新增）
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      # OTEL（全链路追踪，新增）
      OTEL_SERVICE_NAME: "agent-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      # LLM 配置（来自环境变量）
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      # MCP 配置
      MCP_SERVERS: "${MCP_SERVERS:-filesystem,brave-search}"
    volumes:
      # 持久化数据卷
      - agent-data:/app/data
      - agent-chroma:/app/chroma_db
      - agent-logs:/app/logs
      # MCP 配置（如果外部化）
      - ./config/mcp.json:/app/config/mcp.json:ro
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started  # Chroma 启动较慢，不阻塞
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 2G

  # ============================================================
  # Redis - 评估缓存 + 会话缓存
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 100
      --save 60 10000
    environment:
      <<: *common_env
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agent-network

  # ============================================================
  # Chroma 向量数据库（可选分离部署）
  # ============================================================
  chroma:
    image: ghcr.io/chroma-core/chroma:0.5.4
    container_name: agent-chroma
    restart: unless-stopped
    ports:
      - "${CHROMA_EXTERNAL_PORT:-8000}:8000"
    environment:
      <<: *common_env
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_SERVER_AUTH_CREDENTIALS_FILE: "/data/auth.json"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - agent-network

  # ============================================================
  # OTEL Collector - 全链路追踪收集器
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector:0.110.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      # OTLP gRPC
      - "4317:4317"
      # OTLP HTTP
      - "4318:4318"
      # Prometheus 指标
      - "8889:8889"
      # Prometheus exporter（暴露给 Prometheus 拉取）
      - "8888:8888"
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - agent-network

  # ============================================================
  # Prometheus - 指标收集（可选）
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: agent-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus_alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    rule_files:
      - /etc/prometheus/rules/*.yml
    networks:
      - agent-network
    depends_on:
      - agent-service

  # ============================================================
  # Grafana - SLO Dashboard（可选）
  # ============================================================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: agent-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      <<: *common_env
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - agent-network
    depends_on:
      - prometheus

  # ============================================================
  # Jaeger - 分布式追踪可视化（可选）
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: agent-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_PORT:-16686}:16686"
      - "6831:6831/udp"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "badger"
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: "/badger-data"
    volumes:
      - jaeger-data:/badger-data
    networks:
      - agent-network
    depends_on:
      - otel-collector

# ============================================================
# 网络定义
# ============================================================
networks:
  agent-network:
    driver: bridge

# ============================================================
# 数据卷定义
# ============================================================
volumes:
  agent-data:
    driver: local
  agent-chroma:
    driver: local
  agent-logs:
    driver: local
  redis-data:
    driver: local
  chroma-data:
    driver: local
  prometheus-data:
    driver: local
