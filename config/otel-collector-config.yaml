# OpenTelemetry Collector 配置
# 接收来自各微服务的 trace 和 metric，上报给后端存储

receivers:
  # ── OTLP 接收器（gRPC + HTTP）─────────────────────────────
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # ── Prometheus 拉取（agent-service 的 /metrics 端点）─────
  prometheus:
    config:
      scrape_configs:
        - job_name: "agent-service"
          static_configs:
            - targets: ["agent-service:${API_PORT:-8080}"]
          metrics_path: "/metrics"
          scrape_interval: 15s

processors:
  # ── 批处理（减少网络请求）─────────────────────────────────
  batch:
    timeout: 5s
    send_batch_size: 1024

  # ── 采样（生产环境降低存储开销）──────────────────────────
  tail_sampling:
    decision_wait: 10s
    policies:
      - name: errors-policy
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow-traces-policy
        type: latency
        latency: { threshold_ms: 1000 }
      - name: probabilistic-policy
        type: probabilistic
        probabilistic: { sampling_percentage: 20 }

  # ── 资源属性增强 ────────────────────────────────────────
  resource:
    attributes:
      - action: upsert
        key: deployment.environment
        value: ${ENVIRONMENT:-production}

exporters:
  # ── Jaeger 导出（分布式追踪）────────────────────────────
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  # ── Prometheus 导出（指标）───────────────────────────────
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "agent_service"
    const_labels:
      service: agent-service

  # ── 日志导出（可选）─────────────────────────────────────
  logging:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, tail_sampling, batch]
      exporters: [jaeger, logging]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheus, logging]
