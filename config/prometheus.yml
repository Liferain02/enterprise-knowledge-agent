# Prometheus 配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # ── Agent Service ──────────────────────────────────────────
  - job_name: "agent-service"
    static_configs:
      - targets: ["agent-service:8080"]
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s

  # ── OTEL Collector ────────────────────────────────────────
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: "/metrics"

  # ── Redis（可选，通过 redis_exporter）───────────────────
  - job_name: "redis"
    static_configs:
      - targets: ["redis:9121"]
