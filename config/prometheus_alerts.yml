# 企业知识库 - Prometheus 告警规则
# 使用方式：将此文件挂载到 Prometheus 的 /etc/prometheus/rules/ 目录
# 并在 prometheus.yml 中添加 rule_files 配置

groups:
  - name: enterprise_knowledge_agent
    interval: 30s
    rules:
      # ── API 可用性 ────────────────────────────────────────

      - alert: APIHighErrorRate
        expr: |
          (
            sum(rate(ekb_chat_requests_total{status="error"}[5m])) by (agent)
            /
            sum(rate(ekb_chat_requests_total[5m])) by (agent)
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          service: enterprise-knowledge-agent
        annotations:
          summary: "聊天接口错误率超过 5%"
          description: "Agent {{ $labels.agent }} 错误率: {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.example.com/runbooks/high-error-rate"

      - alert: APIHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(ekb_chat_latency_seconds_bucket[5m])) by (le)
          ) > 10
        for: 5m
        labels:
          severity: warning
          service: enterprise-knowledge-agent
        annotations:
          summary: "聊天接口 P95 延迟超过 10 秒"
          description: "P95 延迟: {{ $value | humanizeDuration }}"

      - alert: APIVeryHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(ekb_chat_latency_seconds_bucket[5m])) by (le)
          ) > 30
        for: 2m
        labels:
          severity: critical
          service: enterprise-knowledge-agent
        annotations:
          summary: "聊天接口 P95 延迟超过 30 秒"
          description: "P95 延迟: {{ $value | humanizeDuration }}"

      # ── RAG 质量 ──────────────────────────────────────────

      - alert: HighNoResultsRate
        expr: |
          sum(rate(ekb_crag_decisions_total{decision="no_results"}[5m]))
          /
          sum(rate(ekb_crag_decisions_total[5m])) > 0.3
        for: 10m
        labels:
          severity: warning
          service: enterprise-knowledge-agent
        annotations:
          summary: "CRAG 无结果比例过高 (>30%)"
          description: "无结果比例: {{ $value | humanizePercentage }}，可能需要扩充知识库"

      - alert: LowRetrievalQuality
        expr: ekb_crag_retrieval_avg_score < 0.3
        for: 15m
        labels:
          severity: warning
          service: enterprise-knowledge-agent
        annotations:
          summary: "检索质量持续偏低"
          description: "最近平均检索相关度: {{ $value | printf \"%.2f\" }}"

      # ── LLM 问题 ──────────────────────────────────────────

      - alert: LLMHighErrorRate
        expr: |
          sum(rate(ekb_llm_errors_total[5m])) by (error_type)
          > 0.1
        for: 3m
        labels:
          severity: critical
          service: enterprise-knowledge-agent
        annotations:
          summary: "LLM 错误率过高"
          description: "错误类型 {{ $labels.error_type }} 频率: {{ $value | humanize }} 次/秒"

      - alert: LLMRateLimited
        expr: |
          sum(rate(ekb_llm_errors_total{error_type="rate_limited"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          service: enterprise-knowledge-agent
        annotations:
          summary: "LLM API 限流持续发生"
          description: "LLM API 限流频率: {{ $value | humanize }} 次/秒"

      # ── Rate Limiting ─────────────────────────────────────

      - alert: HighRateLimitHits
        expr: |
          sum(rate(ekb_rate_limit_hits_total[5m])) by (endpoint)
          > 10
        for: 5m
        labels:
          severity: warning
          service: enterprise-knowledge-agent
        annotations:
          summary: "限流触发频率过高"
          description: "端点 {{ $labels.endpoint }} 限流频率: {{ $value | humanize }} 次/秒"

      - alert: DDoSSuspected
        expr: |
          sum(rate(ekb_rate_limit_hits_total[1m])) by (id_type)
          > 100
        for: 1m
        labels:
          severity: critical
          service: enterprise-knowledge-agent
        annotations:
          summary: "疑似 DDoS 攻击"
          description: "{{ $labels.id_type }} 类型限流频率: {{ $value | humanize }} 次/秒"

      # ── 安全 ─────────────────────────────────────────────

      - alert: HighAuthFailureRate
        expr: |
          (
            sum(rate(ekb_auth_attempts_total{result="failed"}[5m]))
            /
            sum(rate(ekb_auth_attempts_total[5m]))
          ) > 0.3
        for: 5m
        labels:
          severity: warning
          service: enterprise-knowledge-agent
        annotations:
          summary: "认证失败率过高"
          description: "认证失败比例: {{ $value | humanizePercentage }}"

      - alert: BruteForceSuspected
        expr: |
          sum(rate(ekb_auth_attempts_total{result="failed"}[1m])) by (user)
          > 10
        for: 2m
        labels:
          severity: critical
          service: enterprise-knowledge-agent
        annotations:
          summary: "疑似暴力破解"
          description: "用户 {{ $labels.user }} 认证失败频率: {{ $value | humanize }} 次/秒"

      # ── 系统资源 ──────────────────────────────────────────

      - alert: VectorstoreEmpty
        expr: ekb_vectorstore_chunk_count == 0
        for: 5m
        labels:
          severity: warning
          service: enterprise-knowledge-agent
        annotations:
          summary: "知识库为空"
          description: "向量库 chunk 数量为 0，可能需要导入文档"

      - alert: HighTokenUsage
        expr: |
          histogram_quantile(0.95,
            sum(rate(ekb_llm_tokens_bucket{direction="output"}[1h])) by (le, model)
          ) > 10000
        for: 10m
        labels:
          severity: warning
          service: enterprise-knowledge-agent
        annotations:
          summary: "Token 消耗过高"
          description: "模型 {{ $labels.model }} 输出 token P95: {{ $value }}"

      # ── 会话管理 ─────────────────────────────────────────

      - alert: SessionAnomaly
        expr: |
          abs(
            ekb_active_sessions - ekb_active_sessions offset 1h
          ) / ekb_active_sessions > 5
        for: 10m
        labels:
          severity: info
          service: enterprise-knowledge-agent
        annotations:
          summary: "会话数量异常波动"
          description: "与 1 小时前相比变化超过 500%"

  - name: enterprise_knowledge_infrastructure
    interval: 60s
    rules:
      # ── 下游依赖 ───────────────────────────────────────────

      - alert: RedisDown
        expr: up{job="agent-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Agent 服务不可用"
          description: "服务 {{ $labels.instance }} 已宕机"

      - alert: HighCRAGGradingLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(ekb_crag_grade_latency_seconds_bucket[5m])) by (le)
          ) > 20
        for: 10m
        labels:
          severity: warning
          service: enterprise-knowledge-agent
        annotations:
          summary: "CRAG 评估延迟过高"
          description: "P95 评估延迟: {{ $value | humanizeDuration }}"

      - alert: RerankerSlow
        expr: |
          histogram_quantile(0.95,
            sum(rate(ekb_reranker_latency_seconds_bucket[5m])) by (le)
          ) > 5
        for: 10m
        labels:
          severity: warning
          service: enterprise-knowledge-agent
        annotations:
          summary: "Reranker 延迟过高"
          description: "P95 延迟: {{ $value | humanizeDuration }}"
